<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat with Naz — MBA Student · Seeking Working Student Role in AI</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --border: #2a2a3a;
    --accent: #7c6aff;
    --accent2: #ff6b6b;
    --accent3: #4ecdc4;
    --text: #e8e8f0;
    --text-dim: #888899;
    --text-bright: #ffffff;
    --bot-bubble: #151520;
    --user-bubble: rgba(124,106,255,0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "DM Sans", sans-serif; font-weight: 300;
    height: 100vh; overflow: hidden; position: relative;
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(124,106,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,106,255,0.04) 1px, transparent 1px);
    background-size: 50px 50px; pointer-events: none; z-index: 0;
  }
  .orb { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; animation: float 8s ease-in-out infinite; }
  .orb1 { width: 400px; height: 400px; background: rgba(124,106,255,0.08); top: -100px; right: -100px; }
  .orb2 { width: 300px; height: 300px; background: rgba(78,205,196,0.06); bottom: 100px; left: -50px; animation-delay: -3s; }
  .orb3 { width: 200px; height: 200px; background: rgba(255,107,107,0.06); top: 50%; right: 20%; animation-delay: -5s; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }
  .app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100vh; max-width: 800px; margin: 0 auto; padding: 0 16px; }
  header { padding: 16px 0 14px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .avatar-wrap { position: relative; flex-shrink: 0; }
  .avatar-img { width: 48px; height: 48px; border-radius: 14px; object-fit: cover; object-position: center top; border: 2px solid rgba(124,106,255,0.4); box-shadow: 0 0 20px rgba(124,106,255,0.25); }
  .online-dot { position: absolute; bottom: -2px; right: -2px; width: 12px; height: 12px; background: #4ade80; border-radius: 50%; border: 2px solid var(--bg); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,0.4)} 50%{box-shadow:0 0 0 4px rgba(74,222,128,0)} }
  .header-info h1 { font-family: "Syne",sans-serif; font-weight: 700; font-size: 17px; color: var(--text-bright); letter-spacing: -0.3px; }
  .header-info p { font-size: 12px; color: var(--text-dim); font-family: "DM Mono",monospace; margin-top: 2px; }
  .header-tags { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
  .tag { font-family: "DM Mono",monospace; font-size: 10px; padding: 3px 8px; border-radius: 20px; border: 1px solid; letter-spacing: 0.5px; }
  .tag-purple { color: var(--accent); border-color: rgba(124,106,255,0.4); background: rgba(124,106,255,0.08); }
  .tag-teal { color: var(--accent3); border-color: rgba(78,205,196,0.4); background: rgba(78,205,196,0.08); }
  .tag-red { color: var(--accent2); border-color: rgba(255,107,107,0.4); background: rgba(255,107,107,0.08); }
  .header-actions { display: flex; gap: 6px; }
  .icon-btn { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--text-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; text-decoration: none; }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(124,106,255,0.08); }
  .icon-btn svg { width: 15px; height: 15px; }
  .messages { flex: 1; overflow-y: auto; padding: 20px 0; display: flex; flex-direction: column; gap: 18px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .message { display: flex; gap: 10px; animation: msgIn 0.35s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes msgIn { from{opacity:0;transform:translateY(14px) scale(0.97)} to{opacity:1;transform:translateY(0) scale(1)} }
  .message.user { flex-direction: row-reverse; }
  .msg-avatar { width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; font-family: "Syne",sans-serif; margin-top: 4px; overflow: hidden; }
  .bot-avatar { border: 1px solid rgba(124,106,255,0.3); box-shadow: 0 0 10px rgba(124,106,255,0.15); }
  .user-avatar { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); }
  .bot-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
  .bubble-wrap { max-width: calc(100% - 60px); display: flex; flex-direction: column; gap: 4px; }
  .user .bubble-wrap { align-items: flex-end; }
  .bubble { padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.65; font-weight: 300; }
  .bot .bubble { background: var(--bot-bubble); border: 1px solid var(--border); border-top-left-radius: 4px; color: var(--text); }
  .user .bubble { background: var(--user-bubble); border: 1px solid rgba(124,106,255,0.3); border-top-right-radius: 4px; color: var(--text-bright); }
  .bubble strong { color: var(--text-bright); font-weight: 500; }
  .bubble .highlight { color: var(--accent); font-family: "DM Mono",monospace; font-size: 12px; }
  .msg-meta { display: flex; align-items: center; gap: 8px; }
  .msg-time { font-size: 10px; color: var(--text-dim); font-family: "DM Mono",monospace; }
  .copy-btn { background: none; border: none; cursor: pointer; color: var(--text-dim); padding: 2px; border-radius: 4px; opacity: 0; transition: opacity 0.15s, color 0.15s; display: flex; align-items: center; }
  .copy-btn svg { width: 11px; height: 11px; }
  .bot:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { color: var(--accent3); }
  .typing { display: flex; gap: 4px; align-items: center; padding: 14px 18px; background: var(--bot-bubble); border: 1px solid var(--border); border-radius: 14px; border-top-left-radius: 4px; width: fit-content; }
  .typing span { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: bounce 1.2s infinite; opacity: 0.5; }
  .typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
  @keyframes bounce{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-4px);opacity:1}}
  .streaming-cursor { display: inline-block; width: 2px; height: 1em; background: var(--accent); margin-left: 2px; vertical-align: text-bottom; animation: blink 0.7s infinite; }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  .suggestions { padding: 0 0 10px; display: flex; gap: 8px; flex-wrap: wrap; flex-shrink: 0; }
  .suggestion { font-family: "DM Mono",monospace; font-size: 11px; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--text-dim); cursor: pointer; transition: all 0.2s; letter-spacing: 0.3px; }
  .suggestion:hover { border-color: var(--accent); color: var(--accent); background: rgba(124,106,255,0.08); transform: translateY(-1px); }
  .input-area { padding: 10px 0 18px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
  .input-wrap { flex: 1; position: relative; }
  textarea { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 13px; padding: 12px 16px; color: var(--text-bright); font-family: "DM Sans",sans-serif; font-size: 14px; font-weight: 300; resize: none; outline: none; transition: border-color 0.2s, box-shadow 0.2s; line-height: 1.5; max-height: 120px; min-height: 46px; }
  textarea::placeholder{color:var(--text-dim)}
  textarea:focus { border-color: rgba(124,106,255,0.5); box-shadow: 0 0 0 3px rgba(124,106,255,0.08); }
  .input-hint { position: absolute; bottom: 8px; right: 14px; font-family: "DM Mono",monospace; font-size: 9px; color: var(--text-dim); pointer-events: none; opacity: 0.6; }
  .send-btn { width: 46px; height: 46px; border-radius: 13px; border: none; background: linear-gradient(135deg, var(--accent), #5b4ee0); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; box-shadow: 0 4px 14px rgba(124,106,255,0.3); }
  .send-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124,106,255,0.4); }
  .send-btn:active { transform: scale(0.96); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .send-btn svg { width: 18px; height: 18px; }
  a { color: var(--accent3); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--surface2); border: 1px solid var(--border); color: var(--accent3); padding: 8px 18px; border-radius: 20px; font-family: "DM Mono",monospace; font-size: 12px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100; }
  .toast.show { opacity: 1; }
  @media(max-width:600px){.header-tags{display:none}.bubble-wrap{max-width:calc(100% - 50px)}}
</style>
</head>

const conversationHistory = [];
let isStreaming = false;

function getTime() {
  return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function addMessage(role, html, rawText) {
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `message ${role}`;

  const avatarDiv = document.createElement('div');
  avatarDiv.className = `msg-avatar ${role === 'bot' ? 'bot-avatar' : 'user-avatar'}`;
  if (role === 'bot') {
    const img = document.createElement('img');
    img.src = document.querySelector('.avatar-img').src;
    avatarDiv.appendChild(img);
  } else {
    avatarDiv.textContent = 'You';
  }

  const bubbleWrap = document.createElement('div');
  bubbleWrap.className = 'bubble-wrap';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = html;

  const meta = document.createElement('div');
  meta.className = 'msg-meta';

  const time = document.createElement('span');
  time.className = 'msg-time';
  time.textContent = getTime();
  meta.appendChild(time);

  if (role === 'bot') {
    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.title = 'Copy';
    copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
    copyBtn.onclick = () => { navigator.clipboard.writeText(rawText || bubble.innerText); showToast('Copied!'); };
    meta.appendChild(copyBtn);
  }

  bubbleWrap.appendChild(bubble);
  bubbleWrap.appendChild(meta);
  div.appendChild(avatarDiv);
  div.appendChild(bubbleWrap);
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return bubble;
}

function showTyping() {
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'message bot';
  div.id = 'typing-indicator';
  const av = document.createElement('div');
  av.className = 'msg-avatar bot-avatar';
  const img = document.createElement('img');
  img.src = document.querySelector('.avatar-img').src;
  av.appendChild(img);
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
  div.appendChild(av);
  div.appendChild(typing);
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function fmt(text) {
  let html = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/`(.*?)`/g,'<span class="highlight">$1</span>')
    .replace(/\[(.*?)\]\((.*?)\)/g,'<a href="$2" target="_blank">$1</a>');

  html = html.replace(/---\n\*\*You might also ask:\*\*/, '<hr style="border:none;border-top:1px solid var(--border);margin:12px 0"><strong style="color:var(--text-dim);font-size:12px;font-family:monospace;letter-spacing:0.5px">YOU MIGHT ALSO ASK</strong>');

  const lines = html.split('\n');
  let result = '', inList = false;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith('- ')) {
      if (!inList) { result += '<ul style="margin:8px 0;padding-left:0;list-style:none">'; inList = true; }
      result += `<li style="margin:5px 0;display:flex;gap:8px;align-items:flex-start"><span style="color:var(--accent);flex-shrink:0">›</span><span>${line.slice(2)}</span></li>`;
    } else {
      if (inList) { result += '</ul>'; inList = false; }
      if (line.trim() === '') { if (i > 0) result += '<br>'; }
      else result += `<p style="margin:4px 0">${line}</p>`;
    }
  }
  if (inList) result += '</ul>';
  return result;
}

function updateSuggestions(text) {
  const match = text.match(/You might also ask:\n((?:- .+\n?)+)/);
  if (!match) return;
  const sugs = match[1].trim().split('\n').map(s => s.replace(/^- /, '').trim()).filter(Boolean);
  const container = document.getElementById('suggestions');
  container.style.display = 'flex';
  container.innerHTML = '';
  sugs.forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'suggestion';
    btn.textContent = q;
    btn.onclick = () => sendSuggestion(q);
    container.appendChild(btn);
  });
}

async function sendMessage() {
  if (isStreaming) return;
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('suggestions').style.display = 'none';
  isStreaming = true;
  document.getElementById('sendBtn').disabled = true;

  if (conversationHistory.length > 18) {
    const recent = conversationHistory.slice(-8);
    conversationHistory.length = 0;
    conversationHistory.push({role:'user', content:'[Continuing our conversation]'});
    conversationHistory.push({role:'assistant', content:'Of course, happy to continue!'});
    recent.forEach(m => conversationHistory.push(m));
  }

  addMessage('user', `<p>${text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</p>`, text);
  conversationHistory.push({role:'user', content:text});
  showTyping();

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        max_tokens: 1000,
        stream: true,
        messages: [
          { role: 'system', content: SYSTEM_PROMPT },
          ...conversationHistory
        ]
      })
    });

    removeTyping();

    // Check if the response itself failed
    if (!response.ok) {
      const errText = await response.text();
      console.error('API error:', response.status, errText);
      let errDetail = '';
      try { errDetail = JSON.parse(errText)?.error?.message || errText; } catch(e) { errDetail = errText; }
      const errMsg = `API error (${response.status}): ${errDetail}`;
      addMessage('bot', fmt(errMsg), errMsg);
      isStreaming = false;
      document.getElementById('sendBtn').disabled = false;
      return;
    }

    let fullText = '';
    const bubble = addMessage('bot', '<span class="streaming-cursor"></span>', '');

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream:true});
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6);
        if (data === '[DONE]') break;
        try {
          const parsed = JSON.parse(data);
          const delta = parsed.choices?.[0]?.delta?.content;
          if (delta) {
            fullText += delta;
            bubble.innerHTML = fmt(fullText) + '<span class="streaming-cursor"></span>';
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
          }
        } catch(e) {}
      }
    }

    // If we got nothing back, show a fallback
    if (!fullText) {
      fullText = "I didn't get a response — please try again or reach me at **nandikasoni9@gmail.com**.";
    }

    bubble.innerHTML = fmt(fullText);
    const copyBtn = bubble.closest('.message')?.querySelector('.copy-btn');
    if (copyBtn) copyBtn.onclick = () => { navigator.clipboard.writeText(fullText); showToast('Copied!'); };

    conversationHistory.push({role:'assistant', content:fullText});
    updateSuggestions(fullText);

  } catch(err) {
    removeTyping();
    console.error('Fetch error:', err);
    const fallback = "Something went wrong — feel free to reach me at **nandikasoni9@gmail.com** or on [LinkedIn](https://www.linkedin.com/in/nandika-soni-771610220).";
    addMessage('bot', fmt(fallback), fallback);
  }

  isStreaming = false;
  document.getElementById('sendBtn').disabled = false;
}

function sendSuggestion(text) {
  document.getElementById('input').value = text;
  sendMessage();
}

function clearChat() {
  document.getElementById('messages').innerHTML = '';
  conversationHistory.length = 0;
  const sugs = document.getElementById('suggestions');
  sugs.style.display = 'flex';
  sugs.innerHTML = `
    <button class="suggestion" onclick="sendSuggestion(this.textContent)">👋 Who are you?</button>
    <button class="suggestion" onclick="sendSuggestion(this.textContent)">🛠️ Tech skills?</button>
    <button class="suggestion" onclick="sendSuggestion(this.textContent)">💼 Work experience?</button>
    <button class="suggestion" onclick="sendSuggestion(this.textContent)">🚀 Projects?</button>
    <button class="suggestion" onclick="sendSuggestion(this.textContent)">🎓 Education?</button>
    <button class="suggestion" onclick="sendSuggestion(this.textContent)">🌍 Languages?</button>`;
  showToast('Chat cleared');
  setTimeout(triggerWelcome, 300);
}

const textarea = document.getElementById('input');
textarea.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
textarea.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

  const bubble = addMessage('bot', '<span class="streaming-cursor"></span>', '');
  let shown = '';

}
